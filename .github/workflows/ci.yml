# Vets and tests every push to master and every pull request. Linux only: it's
# the cheapest runner, and the release workflow still tests on each platform.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# a newer push supersedes any run still going for the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fyne's build prerequisites, as in the release workflow; the UI
      # packages need them to compile for vet and test.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
